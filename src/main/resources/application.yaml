spring:
  application:
    name: grocery-sub-agent
  ai:
    mcp:
      server:
        name: grocery-sub-agent
        version: 0.0.1
        protocol: STREAMABLE

    google:
      genai:
        # project-id + location (and no api-key) puts the client in Vertex AI mode, authenticated by ADC.
        project-id: ${GOOGLE_CLOUD_PROJECT:grocery-sub-agent}
        # gemini-2.5-flash isn't served from europe-west2; the global endpoint has it and fewer 429s.
        location: ${GOOGLE_CLOUD_LOCATION:global}
        chat:
          model: gemini-3.5-flash
          # Ranking should be repeatable for the same candidates, which also makes live evals less flaky.
          temperature: 0.0
