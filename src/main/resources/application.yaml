spring:
  application:
    name: grocery-sub-agent
  ai:
    mcp:
      server:
        name: grocery-sub-agent
        version: 0.0.1
        protocol: STREAMABLE

    google:
      genai:
        # project-id + location (and no api-key) puts the client in Vertex AI mode, authenticated by ADC.
        project-id: ${GOOGLE_CLOUD_PROJECT:grocery-sub-agent}
        # Global endpoint for now; an eu multi-region is listed for gemini-3.5-flash but untried. See README on data residency.
        location: ${GOOGLE_CLOUD_LOCATION:global}
        chat:
          model: gemini-3.5-flash
